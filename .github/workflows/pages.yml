name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website and media
        run: |
          python3 - <<'PYTHON'
          import base64, pathlib, urllib.request, concurrent.futures
          root=pathlib.Path("_site")
          root.mkdir(exist_ok=True)
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          html = html.replace("./UkOdRaR35OHVp1R7iwCfeUkWaQ.pdf", "./Nanuka_Mgeladze_CV_2026-11-12_v2.pdf")
          html = html.replace("https://www.linkedin.com/in/nanukamgeladze/", "https://www.linkedin.com/in/nanuukaam")
          analytics = '<script defer src="https://cloud.umami.is/script.js" data-website-id="23dbd667-d115-4c91-a1c2-cab6e9033d6d"></script>\n<script>\n(function () {\n  const openedAt = Date.now();\n  let lastSeconds = -1;\n  let cvClicked = false;\n  function report() {\n    if (!window.umami) return;\n    const seconds = Math.max(0, Math.round((Date.now() - openedAt) / 1000));\n    if (seconds === lastSeconds) return;\n    lastSeconds = seconds;\n    const minutes = Math.floor(seconds / 60);\n    const label = minutes ? minutes + \'m \' + seconds % 60 + \'s\' : seconds + \'s\';\n    window.umami.identify({\n      \'Time open\': label,\n      \'Time open seconds\': seconds,\n      \'Opened at\': new Date(openedAt).toISOString(),\n      \'CV clicked this visit\': cvClicked ? \'Yes\' : \'No\'\n    }).catch(function () {});\n  }\n  const tracker = document.querySelector(\'script[data-website-id="23dbd667-d115-4c91-a1c2-cab6e9033d6d"]\');\n  if (window.umami) report();\n  else tracker.addEventListener(\'load\', function () { report(); }, {once: true});\n  setInterval(function () { report(); }, 10000);\n  document.addEventListener(\'visibilitychange\', function () {\n    report();\n  });\n  window.addEventListener(\'pagehide\', function () { report(); });\n  document.addEventListener(\'click\', function (event) {\n    const link = event.target.closest && event.target.closest(\'a\');\n    if (!link || !/download\\s*cv/i.test(link.textContent) || !window.umami) return;\n    cvClicked = true;\n    window.umami.track(\'cv_download\').catch(function () {});\n    lastSeconds = -1;\n    report();\n  }, true);\n})();\n</script>'
          html = html.replace("</head>", analytics + "</head>")
          (root/"index.html").write_text(html, encoding="utf-8")
          (root/".nojekyll").touch()
          urls=['https://framerusercontent.com/assets/dFeYvRsgj8b0rcFkn8BVuIaVY.mp4', 'https://framerusercontent.com/images/e8eIy6cP8Kq02Hu0CzjeRuuBwM.png', 'https://framerusercontent.com/images/Pc63BVprqHvmjBGiljBUGNf2g4I.jpg', 'https://framerusercontent.com/images/O1ECzIvSKfP16TjgDnyqdvKkWE.jpg', 'https://framerusercontent.com/images/BdSt7M9W0Lxhi6kjnftFna7xao.jpg', 'https://framerusercontent.com/images/1hhhEhgUFIGe91gHXEUepeMr4.jpg', 'https://framerusercontent.com/images/LNUBScjGCSQCq8d83ZmjkSbFxg.jpg', 'https://framerusercontent.com/images/f8XDo9bI8NAi8leORD6zBTbSPU.png?width=1080&height=1920', 'https://framerusercontent.com/images/4OxYXX1efBp1pSE5ZAiSOYzGw0.jpg', 'https://framerusercontent.com/images/ClEPAJEsGlQnvIgI47sIJgtKyxY.jpg', 'https://framerusercontent.com/images/QjHQ9MqmiBqYWDbx1pg3EA0w.jpg', 'https://framerusercontent.com/images/BUq03gtQ3EED7RF4gp59ezIORXQ.jpg', 'https://framerusercontent.com/images/gpI6ACnvHy6LBEcvQ4fSr348ts.png?width=1080&height=1920', 'https://framerusercontent.com/images/nSANNqntgxbwBfC6zdrmp6AW8cA.jpg', 'https://framerusercontent.com/images/JfghSzZ765ZK260sfIf9bA5c4.jpg', 'https://framerusercontent.com/images/wrvHpazU5JM2XaGF8KZ38cNcbMQ.jpg', 'https://framerusercontent.com/images/mOhCEhQOWayAfjUn2zfYHwcVvI.png', 'https://framerusercontent.com/images/RQEh5Bf39korLwpVYBK2Qxvn2U.webp', 'https://framerusercontent.com/images/FUIZ0kw9WZSu0bG4YhXC6ldmpvs.webp', 'https://framerusercontent.com/images/jJ58dwbhxQ1XBcK77NNxLfzRggI.webp', 'https://framerusercontent.com/images/mGmWzeaviWZc1czOAzxVBH9uVE.webp', 'https://framerusercontent.com/images/jrijrWCU80pc6610gLvJgZJBU.webp', 'https://framerusercontent.com/images/30HgzxvhnidAs3drLEvXVoUYU.webp', 'https://framerusercontent.com/images/6bpZQqkUwqaaeUOFpZOYlS72g6Y.webp', 'https://framerusercontent.com/images/8GhY0D1bc1c9EOrMD0HgXFRXd4.webp', 'https://framerusercontent.com/images/k6uVFAM5YJW1Vht28C7iywJwLiw.webp', 'https://framerusercontent.com/images/HDYQFEUxE7Xa7WRU4H4iHwMSA5s.webp', 'https:/